name: My First Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  first-pipeline:
    runs-on: self-hosted
    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      - name: Build Docker image with branch and SHA tags
        run: |
          docker build \
            -t hello-world-nginx:v1 \
            -t hello-world-nginx:${{ github.ref_name }} \
            -t hello-world-nginx:${{ github.sha }} \
            .

      - name: Run Docker container
        run: docker run -d -p 8080:80 hello-world-nginx:v1

      - name: Verify container is running
        run: |
          sleep 3
          curl http://localhost:8080